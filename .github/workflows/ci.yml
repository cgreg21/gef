name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, tests and package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build packages
        run: npm run build
      - name: Package GNOME Shell example
        run: npm run package:example
      - name: Verify npm package contents
        run: npm pack --dry-run --ignore-scripts
      - name: Test packed package installation and npx executable
        shell: bash
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          PACKAGE_TARBALL="$(find "$RUNNER_TEMP" -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "$PACKAGE_TARBALL"
          TEST_DIR="$(mktemp -d)"
          cd "$TEST_DIR"
          npm init -y
          npm install "$PACKAGE_TARBALL" --no-audit --no-fund
          ./node_modules/.bin/gef --help
          node --input-type=module -e "await import('gnome-extension-framework'); await import('gnome-extension-framework/runtime')"
          npx --yes --package "$PACKAGE_TARBALL" gef --help

  gtk-integration:
    name: GTK4 and libadwaita integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install GTK4 integration dependencies
        run: sudo apt-get update && sudo apt-get install -y gjs gir1.2-gtk-4.0 gir1.2-adw-1 libglib2.0-bin xvfb
      - name: GTK4 and libadwaita runtime smoke test
        run: npm run test:gtk
