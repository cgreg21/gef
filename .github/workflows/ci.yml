name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, tests and package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build packages
        run: npm run build
      - name: Validate platform packager syntax
        run: |
          node --check scripts/package-app.mjs
          node --check scripts/package-appimage.mjs
          node --check scripts/package-windows.mjs
          node --check scripts/package-macos.mjs
      - name: Smoke test AppImage staging
        run: node tests/packaging/appimage-smoke.mjs
      - name: Install archive tools
        run: sudo apt-get update && sudo apt-get install -y zip unzip
      - name: Package GNOME Shell example
        run: npm run package:example
      - name: Verify npm package manifest and contents
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';

          const manifest = JSON.parse(readFileSync('package.json', 'utf8'));
          const packed = JSON.parse(execFileSync('npm', ['pack', '--dry-run', '--json', '--ignore-scripts'], { encoding: 'utf8' }))[0];
          const files = new Set(packed.files.map((file) => file.path));
          const required = [
            'dist/cli/src/index.js',
            'dist/compiler/src/index.js',
            'dist/compiler/src/index.d.ts',
            'dist/runtime/src/index.js',
            'dist/runtime/src/index.d.ts',
            'scripts/package-appimage.mjs',
            'scripts/package-app.mjs',
            'scripts/package-windows.mjs',
            'scripts/package-macos.mjs',
            'README.md',
          ];

          if (manifest.name !== 'gnome-extension-framework' || manifest.private) {
            throw new Error('The public npm package name or visibility is invalid.');
          }
          if (manifest.bin?.gef !== 'dist/cli/src/index.js') {
            throw new Error('The gef executable is missing or points to the wrong file.');
          }
          for (const entry of ['.', './compiler', './runtime']) {
            const target = manifest.exports?.[entry];
            if (!target?.import || !target?.types) throw new Error(`Missing ESM or type export: ${entry}`);
            for (const path of [target.import, target.types]) {
              if (!files.has(path.replace(/^\.\//, ''))) throw new Error(`Package export is absent from tarball: ${path}`);
            }
          }
          for (const entry of ['./scripts/package-app.mjs', './scripts/package-appimage.mjs', './scripts/package-windows.mjs', './scripts/package-macos.mjs']) {
            if (!files.has(manifest.exports?.[entry]?.replace(/^\\.\\//, ''))) throw new Error(`Packager export is absent from tarball: ${entry}`);
          }
          for (const path of required) {
            if (!files.has(path)) throw new Error(`Required npm package file is missing: ${path}`);
          }
          for (const path of files) {
            if (/^(?:packages|scripts|tests|node_modules)\//.test(path) && path !== 'scripts/package-appimage.mjs') {
              throw new Error(`Development-only file leaked into npm package: ${path}`);
            }
          }
          console.log(`Verified ${packed.name}@${packed.version}: ${files.size} files`);
          NODE
      - name: Test packed package installation and npx executable
        shell: bash
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          PACKAGE_TARBALL="$(find "$RUNNER_TEMP" -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "$PACKAGE_TARBALL"
          TEST_DIR="$(mktemp -d)"
          cd "$TEST_DIR"
          npm init -y
          npm install "$PACKAGE_TARBALL" --no-audit --no-fund
          ./node_modules/.bin/gef --help
          node --input-type=module -e "await import('gnome-extension-framework'); await import('gnome-extension-framework/runtime')"
          npx --yes --package "$PACKAGE_TARBALL" gef --help


  windows:
    name: Windows CLI checks
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript typecheck and unit tests
        run: npm run check
      - name: Build Kitchen Sink and verify Windows Node-GTK bindings
        run: |
          npm run build:kitchen-sink
          npm run test:node-gtk:availability
      - name: Package and launch standalone Windows application
        run: node tests/packaging/windows-smoke.mjs

  macos:
    name: macOS standalone application package
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install GTK4 and libadwaita
        run: brew install gtk4 libadwaita adwaita-icon-theme gobject-introspection pkg-config
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck and unit tests
        run: npm run check
      - name: Build and launch standalone macOS application
        run: node tests/packaging/macos-smoke.mjs

  gtk-integration:
    name: GTK4 and libadwaita integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install GTK4 integration dependencies
        run: sudo apt-get update && sudo apt-get install -y gjs gir1.2-gtk-4.0 gir1.2-adw-1 libglib2.0-bin libgirepository-1.0-1 gir1.2-girepository-2.0 xvfb
      - name: Install Node-GTK runtime
        run: npm install --no-save --package-lock=false node-gtk@4.1.1 --no-audit --no-fund
      - name: GTK4 and libadwaita runtime smoke test
        run: npm run test:gtk
      - name: Build and smoke test GEF Kitchen Sink
        run: |
          npm run build:kitchen-sink
          GTK_A11Y=none xvfb-run -a gjs -m tests/gtk4/kitchen-sink-smoke.js
      - name: Node-GTK renderer smoke test
        run: npm run build && node dist/cli/src/index.js compile tests/node-gtk/smoke.gtpl dist/node-gtk-view.js && GTK_A11Y=none xvfb-run -a node --import node-gtk/register tests/node-gtk/smoke.mjs
