name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Verify release tag matches package version
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const { version } = JSON.parse(readFileSync("package.json", "utf8"));
            const expected = `v${version}`;
            if (process.env.GITHUB_REF_NAME !== expected) {
              throw new Error(`Release tag must be ${expected}, got ${process.env.GITHUB_REF_NAME}`);
            }
          '
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Update npm for trusted publishing
        run: npm install --global npm@^11.5.1
      - name: Verify npm version
        run: npm --version
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build packages
        run: npm run build
      - name: Package GNOME Shell example
        run: npm run package:example
      - name: Select npm dist-tag
        id: release-channel
        run: |
          DIST_TAG="$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const { version } = JSON.parse(readFileSync("package.json", "utf8"));
            process.stdout.write(version.includes("-") ? "next" : "latest");
          ')"
          echo "dist_tag=$DIST_TAG" >> "$GITHUB_OUTPUT"
      - name: Publish with npm trusted publishing
        run: npm publish --access public --tag "${{ steps.release-channel.outputs.dist_tag }}"
